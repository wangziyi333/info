<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 明日学院 · 员工信息审核系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-card-brand">
        <div class="login-card-logo"><span>明</span></div>
        <h2>明日学院</h2>
        <p class="login-card-subtitle">员工信息审核系统</p>
      </div>
      <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" class="form-control" required placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" class="form-control" required placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
      </form>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
          <div class="login-error">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
    </div>
  </div>
  <script>
    window._flashMessages = [];
  </script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
