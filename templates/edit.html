{% extends "base.html" %}
{% block title %}修改信息 · 员工信息审核系统{% endblock %}
{% block content %}
<div class="page-header">
  <h1>修改信息</h1>
  <p>修改后需重新提交审核</p>
</div>

<div class="card" style="max-width: 600px;">
  <div class="card-header">
    <h2>编辑个人信息</h2>
  </div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('edit') }}">
      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" class="form-control" value="{{ user.name }}" required placeholder="请输入姓名">
      </div>
      <div class="form-group">
        <label for="department">部门</label>
        <input type="text" id="department" name="department" class="form-control" value="{{ user.department }}" required placeholder="请输入部门">
      </div>
      <div class="form-group">
        <label for="position">职务</label>
        <input type="text" id="position" name="position" class="form-control" value="{{ user.position }}" required placeholder="请输入职务">
      </div>
      <div class="form-group">
        <label for="entry_date">入职时间</label>
        <input type="date" id="entry_date" name="entry_date" class="form-control" value="{{ user.entry_date.strftime('%Y-%m-%d') }}" required>
      </div>
      <div class="action-bar">
        <button type="submit" class="btn btn-success">提交审核</button>
        <a href="{{ url_for('profile') }}" class="btn btn-ghost">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
