{% extends "base.html" %}
{% block title %}添加员工 · 员工信息审核系统{% endblock %}
{% block content %}

<div class="page-header">
  <h1>添加员工</h1>
  <p>管理员可在此创建新员工账号</p>
</div>

<div class="card" style="max-width: 600px;">
  <div class="card-header">
    <h2>新增员工信息</h2>
  </div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('add_user') }}">

      <div class="form-group">
        <label>登录账号</label>
        <input type="text" name="username" class="form-control" required placeholder="请输入账号">
      </div>

      <div class="form-group">
        <label>登录密码</label>
        <input type="password" name="password" class="form-control" required placeholder="请输入密码">
      </div>

      <div class="form-group">
        <label>姓名</label>
        <input type="text" name="name" class="form-control" required placeholder="员工姓名">
      </div>

      <div class="form-group">
        <label>部门</label>
        <input type="text" name="department" class="form-control" required placeholder="如：技术部">
      </div>

      <div class="form-group">
        <label>职务</label>
        <input type="text" name="position" class="form-control" required placeholder="如：工程师">
      </div>

      <div class="form-group">
        <label>入职时间</label>
        <input type="date" name="entry_date" class="form-control" required>
      </div>

      <div class="form-group">
        <label>工龄（年）</label>
        <input type="number" name="work_years" class="form-control" required value="0">
      </div>

      <div class="form-group">
        <label>工龄工资</label>
        <input type="number" step="0.01" name="seniority_salary" class="form-control" required value="0">
      </div>

      <div class="action-bar">
        <button type="submit" class="btn btn-success">创建员工</button>
        <a href="{{ url_for('audit_list') }}" class="btn btn-ghost">返回</a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
